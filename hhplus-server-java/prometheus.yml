global:
  scrape_interval: 15s
  evaluation_interval: 15s

remote_write:
  - url: http://prometheus:9090/api/v1/write

scrape_configs:
  - job_name: "spring-actuator"
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    static_configs:
      - targets: ['host.docker.internal:8080']  # 호스트 머신의 Spring Boot