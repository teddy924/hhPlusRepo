spring:
  config:
    activate:
      on-profile: test

  jpa:
    open-in-view: false
    generate-ddl: false
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate.timezone.default_storage: NORMALIZE_UTC
      hibernate.jdbc.time_zone: UTC

  data:
    redis:
      host: localhost
      port: 6379

slaves:
  redis:
    - host: localhost
      port: 6380
    - host: localhost
      port: 6381
